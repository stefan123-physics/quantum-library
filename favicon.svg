<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Tab icon tuned for 16–32 px: bold orbits, no fine detail. Adapts to the browser's light/dark UI. -->
  <style>
    .tile { fill: #0b1330; }
    .o1 { stroke: #38bdf8; } .o2 { stroke: #a78bfa; } .o3 { stroke: #f472b6; }
    .core { fill: #fbbf24; }
    @media (prefers-color-scheme: light) {
      .tile { fill: #eef3ff; }
      .o1 { stroke: #2563eb; } .o2 { stroke: #7c3aed; } .o3 { stroke: #db2777; }
      .core { fill: #f59e0b; }
    }
  </style>
  <rect class="tile" width="64" height="64" rx="15"/>
  <g transform="translate(32 32)" fill="none" stroke-width="4.2">
    <ellipse class="o1" rx="25" ry="9.5"/>
    <ellipse class="o2" rx="25" ry="9.5" transform="rotate(60)"/>
    <ellipse class="o3" rx="25" ry="9.5" transform="rotate(120)"/>
  </g>
  <circle class="core" cx="32" cy="32" r="6"/>
</svg>
