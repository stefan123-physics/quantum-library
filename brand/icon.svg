<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Master app icon: an atom (three orbitals + nucleus) on a deep-space tile with a faint lab grid. -->
  <defs>
    <radialGradient id="bg" cx="35%" cy="25%" r="90%">
      <stop offset="0" stop-color="#1a2a5c"/>
      <stop offset=".55" stop-color="#0b1330"/>
      <stop offset="1" stop-color="#050916"/>
    </radialGradient>
    <radialGradient id="core" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#fff7d1"/>
      <stop offset=".45" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#f97316"/>
    </radialGradient>
    <radialGradient id="halo" r="50%">
      <stop offset="0" stop-color="#fbbf24" stop-opacity=".55"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#7aa2ff" stroke-opacity=".07" stroke-width="2"/>
    </pattern>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="tile"><rect width="512" height="512" rx="__RX__"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="512" height="512" fill="url(#bg)"/>
    <rect width="512" height="512" fill="url(#grid)"/>
    <g transform="translate(256 256) scale(__SCALE__)">
      <g fill="none" stroke-width="15" stroke-linecap="round" filter="url(#glow)">
        <ellipse rx="190" ry="70" stroke="#38bdf8"/>
        <ellipse rx="190" ry="70" stroke="#a78bfa" transform="rotate(60)"/>
        <ellipse rx="190" ry="70" stroke="#f472b6" transform="rotate(120)"/>
      </g>
      <!-- electrons -->
      <circle cx="190" cy="0" r="17" fill="#e0f2fe" filter="url(#glow)"/>
      <circle cx="190" cy="0" r="17" fill="#ede9fe" transform="rotate(60) rotate(180)" filter="url(#glow)"/>
      <circle cx="-95" cy="-60.6" r="17" fill="#fce7f3" transform="rotate(120)" filter="url(#glow)"/>
      <circle r="95" fill="url(#halo)"/>
      <circle r="46" fill="url(#core)"/>
    </g>
  </g>
</svg>
